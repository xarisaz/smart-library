name: Build Smart Library installers

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked
      - name: Check frontend JavaScript
        run: node --check frontend/app.js
      - name: Check Rust formatting
        working-directory: src-tauri
        run: cargo fmt -- --check
      - name: Check Rust project
        working-directory: src-tauri
        run: cargo check
      - name: Run Rust unit tests
        working-directory: src-tauri
        run: cargo test
      - name: Build Windows NSIS installer
        working-directory: src-tauri
        run: cargo tauri build
      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: Smart-Library-Windows
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential pkg-config libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev libssl-dev \
            libdbus-1-dev libxdo-dev patchelf \
            gstreamer1.0-plugins-base gstreamer1.0-plugins-good
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked
      - name: Check frontend JavaScript
        run: node --check frontend/app.js
      - name: Check Rust formatting
        working-directory: src-tauri
        run: cargo fmt -- --check
      - name: Check Rust project
        working-directory: src-tauri
        run: cargo check
      - name: Run Rust unit tests
        working-directory: src-tauri
        run: cargo test
      - name: Build Linux packages
        working-directory: src-tauri
        run: cargo tauri build
      - name: Upload Debian package
        uses: actions/upload-artifact@v4
        with:
          name: Smart-Library-Linux-DEB
          path: src-tauri/target/release/bundle/deb/*.deb
          if-no-files-found: error
      - name: Upload AppImage
        uses: actions/upload-artifact@v4
        with:
          name: Smart-Library-Linux-AppImage
          path: src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: error
