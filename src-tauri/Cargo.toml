[package]
name = "smart-library"
version = "0.3.4"
description = "A privacy-first, read-only document organizer for Windows and Linux"
authors = ["Smart Library"]
edition = "2021"

[lib]
name = "smart_library_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
dirs = "6"
encoding_rs = "0.8"
hex = "0.4"
imap = { version = "2.4.1", default-features = false }
mailparse = "0.17"
mime_guess = "2"
native-tls = "0.2"
pdf-extract = "0.12"
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rfd = "0.15"
roxmltree = "0.21"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2.5"
url = "2"
walkdir = "2"
zip = { version = "8.6", default-features = false, features = ["deflate"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Security_Credentials"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3.6.3", default-features = false, features = ["sync-secret-service", "crypto-rust"] }
